name: Package Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'material/grant/example_grant_proposal.md'
      - 'material/grant/example_grant_proposal.css'
      - '.github/workflows/package-skills.yml'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'material/grant/example_grant_proposal.md'
      - 'material/grant/example_grant_proposal.css'
      - '.github/workflows/package-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-skills:
    name: Package Skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package skills into zip files
        run: |
          mkdir -p dist
          for skill_dir in skills/*; do
            if [ -d "$skill_dir" ] && [ -f "$skill_dir/SKILL.md" ]; then
              skill_name=$(basename "$skill_dir")
              echo "==> Packaging $skill_name..."
              (cd "$skill_dir" && zip -r -q "../../dist/${skill_name}.zip" * -x "*/.*" -x "*__pycache__*" -x "*.pyc")
              echo "Contents of dist/${skill_name}.zip:"
              unzip -l "dist/${skill_name}.zip"
            fi
          done
          echo "==> Generated archives:"
          ls -lh dist/

      - name: Upload salary-calculator artifact
        uses: actions/upload-artifact@v4
        with:
          name: salary-calculator
          path: dist/salary-calculator.zip
          if-no-files-found: error

      - name: Upload make-gantt-chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: make-gantt-chart
          path: dist/make-gantt-chart.zip
          if-no-files-found: error

      - name: Build example grant proposal PDF
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc weasyprint fonts-liberation
          pandoc material/grant/example_grant_proposal.md \
            --from markdown+hard_line_breaks \
            --pdf-engine=weasyprint \
            --css material/grant/example_grant_proposal.css \
            --output dist/example_grant_proposal.pdf
          ls -lh dist/example_grant_proposal.pdf

      - name: Upload example grant proposal artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-grant-proposal
          path: dist/example_grant_proposal.pdf
          if-no-files-found: error

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest workshop materials
          prerelease: false
          files: |
            dist/salary-calculator.zip
            dist/make-gantt-chart.zip
            dist/example_grant_proposal.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
